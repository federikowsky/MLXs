[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlxs"
version = "0.1.0"
description = "High-performance MLX inference library and server for Apple Silicon"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mlx>=0.22.0",
    "safetensors>=0.4.0",
    "transformers>=4.40.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlxs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring MLX and model files (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["mlxs"]
mypy_path = "src"
